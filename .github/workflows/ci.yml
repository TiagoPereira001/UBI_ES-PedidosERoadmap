# Corre as verificações de qualidade e os testes em cada pull request e em cada push para a main (EDS-165).
# Num push para a main com tudo verde, publica as imagens Docker no GitHub (EDS-196).
name: Testes

on:
  push:
    branches: [main]
  pull_request:

# Só leitura; o job que publica pede o que precisa.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      # Estilo e erros comuns do código (regras em backend/pyproject.toml).
      - run: ruff check .
      # Testes com cobertura; falha se a cobertura descer dos 90 %.
      - run: coverage run manage.py test
      - run: coverage report --fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run build

  publicar:
    # Só depois de os testes dos dois lados passarem, e nunca num pull request.
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        parte: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Entrar no ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Construir e publicar a imagem
        run: |
          # O ghcr.io só aceita nomes em minúsculas.
          imagem="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.parte }}"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$imagem:latest" -t "$imagem:$GITHUB_SHA" "${{ matrix.parte }}"
          docker push --all-tags "$imagem"
